<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#f5f1e8" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="回联盟" />
    <meta
      name="description"
      content="回联盟：独立、无激活的远程和本地 ZIP 文件浏览器。"
    />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="assets/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="assets/apple-touch-icon.png" />
    <link rel="stylesheet" href="styles.css" />
    <title>回联盟</title>
  </head>
  <body>
    <div class="page-glow page-glow-one"></div>
    <div class="page-glow page-glow-two"></div>

    <main class="app-shell">
      <header class="topbar">
        <a class="brand" href="./" aria-label="回联盟首页">
          <span class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 64 64" role="img">
              <path
                d="M50.5 21.5A22 22 0 0 0 13.7 18L8 24m0 0V10m0 14h14M13.5 42.5A22 22 0 0 0 50.3 46L56 40m0 0v14m0-14H42"
              />
            </svg>
          </span>
          <span>
            <strong>回联盟</strong>
            <small>轻量归档浏览器</small>
          </span>
        </a>
        <button class="icon-button" id="installButton" type="button" hidden>
          安装
        </button>
      </header>

      <section class="hero">
        <div class="hero-copy">
          <p class="eyebrow">LOCAL FIRST · NO ACTIVATION</p>
          <h1>打开远程归档，<br />不必等待完整下载。</h1>
          <p class="hero-note">
            通过 HTTP Range 读取 ZIP 目录，或直接选择手机里的归档文件。
            所有操作在当前设备完成。
          </p>
        </div>
        <div class="hero-stat">
          <span class="pulse-dot"></span>
          <span id="privacyStatus">本地模式已就绪</span>
        </div>
      </section>

      <section class="open-panel" aria-labelledby="openTitle">
        <div class="section-heading">
          <div>
            <p class="section-kicker">打开资源</p>
            <h2 id="openTitle">选择归档来源</h2>
          </div>
          <span class="privacy-badge">无账号</span>
        </div>

        <form class="url-form" id="urlForm">
          <label for="archiveUrl">远程 ZIP 地址</label>
          <div class="url-control">
            <span class="url-prefix" aria-hidden="true">↗</span>
            <input
              id="archiveUrl"
              name="archiveUrl"
              type="url"
              inputmode="url"
              autocomplete="url"
              autocapitalize="off"
              spellcheck="false"
              placeholder="https://example.com/archive.zip"
            />
            <button class="primary-button" id="openRemoteButton" type="submit">
              打开
            </button>
          </div>
        </form>

        <div class="divider"><span>或</span></div>

        <button class="local-button" id="chooseLocalButton" type="button">
          <span class="local-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24">
              <path d="M12 16V4m0 0L7.5 8.5M12 4l4.5 4.5" />
              <path d="M5 14v4.5A1.5 1.5 0 0 0 6.5 20h11a1.5 1.5 0 0 0 1.5-1.5V14" />
            </svg>
          </span>
          <span>
            <strong>从本机导入</strong>
            <small>支持 ZIP、IPA、TIP A、JAR、APK</small>
          </span>
          <span class="chevron">›</span>
        </button>
        <input
          id="localFileInput"
          type="file"
          accept=".zip,.ipa,.tipa,.jar,.apk,application/zip,application/octet-stream"
          hidden
        />

        <p class="hint" id="sourceHint">
          远程地址需要支持 CORS 和 Range 请求。普通的 HTTPS 静态文件通常可以正常使用。
        </p>
      </section>

      <section class="status-card" id="statusCard" aria-live="polite">
        <span class="loader" id="statusLoader" aria-hidden="true"></span>
        <span class="status-icon" id="statusIcon" aria-hidden="true">✓</span>
        <div>
          <strong id="statusTitle">准备就绪</strong>
          <p id="statusText">输入地址或选择一个本地归档。</p>
        </div>
      </section>

      <section class="archive-section" id="archiveSection" hidden>
        <div class="archive-heading">
          <div>
            <p class="section-kicker">归档内容</p>
            <h2 id="archiveName">未命名归档</h2>
            <p class="archive-meta" id="archiveMeta"></p>
          </div>
          <button class="ghost-button" id="closeArchiveButton" type="button">
            关闭
          </button>
        </div>

        <div class="toolbar">
          <label class="search-box" for="searchInput">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="11" cy="11" r="6.5"></circle>
              <path d="m16 16 4 4"></path>
            </svg>
            <input
              id="searchInput"
              type="search"
              placeholder="搜索文件或目录"
              autocomplete="off"
              spellcheck="false"
            />
          </label>
          <span class="result-count" id="resultCount">0 项</span>
        </div>

        <div class="file-list" id="fileList"></div>
        <div class="empty-list" id="emptyList" hidden>
          <span>⌁</span>
          <strong>没有匹配的文件</strong>
          <p>换一个关键词再试。</p>
        </div>
      </section>

      <footer class="footer">
        <span>回联盟</span>
        <span>文件只在你的设备上处理</span>
      </footer>
    </main>

    <dialog class="preview-dialog" id="previewDialog">
      <div class="dialog-head">
        <div>
          <p class="section-kicker">文件预览</p>
          <h2 id="previewTitle">文件</h2>
          <p id="previewMeta"></p>
        </div>
        <button class="icon-button" id="closePreviewButton" type="button" aria-label="关闭预览">
          ×
        </button>
      </div>
      <div class="preview-content" id="previewContent"></div>
      <div class="dialog-actions">
        <button class="secondary-button" id="cancelPreviewButton" type="button">
          关闭
        </button>
        <button class="primary-button" id="downloadButton" type="button">
          保存文件
        </button>
      </div>
    </dialog>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <script src="app.js" type="module"></script>
  </body>
</html>
